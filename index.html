<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Student Video AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f7f7f7;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    h2 {
      margin-top: 30px;
    }

    button {
      padding: 12px 20px;
      margin-top: 15px;
      cursor: pointer;
      font-size: 16px;
    }

    input {
      margin-top: 15px;
    }

    .status {
      margin-top: 20px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      margin-top: 15px;
      padding: 12px;
      box-sizing: border-box;
      font-size: 15px;
    }

    #analysisOutput {
      min-height: 160px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Student Video AI</h1>

  <p>
    Upload a lesson video. AI will transcribe it and extract the key points directly on your device.
  </p>

  <input
    type="file"
    id="fileInput"
    accept="video/*,audio/*"
  />

  <br>

  <button id="transcribeButton" disabled>
    Generate Transcript
  </button>

  <div id="status" class="status">
    Select a video.
  </div>


  <h2>Transcript</h2>

  <textarea
    id="output"
    readonly
    placeholder="Your transcript will appear here..."
  ></textarea>


  <button id="analyzeButton" disabled>
    Generate Key Points
  </button>

  <div id="analysisStatus" class="status"></div>


  <h2>Key Points</h2>

  <textarea
    id="analysisOutput"
    readonly
    placeholder="Your key points will appear here..."
  ></textarea>

</div>


<script type="module">

import {
  pipeline
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";


const fileInput =
  document.getElementById("fileInput");

const transcribeButton =
  document.getElementById("transcribeButton");

const status =
  document.getElementById("status");

const output =
  document.getElementById("output");

const analyzeButton =
  document.getElementById("analyzeButton");

const analysisStatus =
  document.getElementById("analysisStatus");

const analysisOutput =
  document.getElementById("analysisOutput");


const MAX_SIZE =
  100 * 1024 * 1024;

const MAX_DURATION =
  10 * 60;


let selectedFile = null;
let transcriber = null;
let analyzer = null;



// ------------------------------
// SELECT VIDEO
// ------------------------------

fileInput.addEventListener("change", async () => {

  output.value = "";
  analysisOutput.value = "";

  transcribeButton.disabled = true;
  analyzeButton.disabled = true;

  const file = fileInput.files[0];

  if (!file) return;


  if (file.size > MAX_SIZE) {

    status.textContent =
      "Video too large. Maximum size is 100 MB.";

    return;
  }


  status.textContent =
    "Checking video...";


  try {

    const duration =
      await getMediaDuration(file);


    if (duration > MAX_DURATION) {

      status.textContent =
        "Video too long. Maximum duration is 10 minutes.";

      return;
    }


    selectedFile = file;

    status.textContent =
      `Ready — ${Math.round(duration)} seconds`;

    transcribeButton.disabled = false;

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "Could not read this video.";

  }

});



// ------------------------------
// TRANSCRIBE VIDEO
// ------------------------------

transcribeButton.addEventListener(
  "click",
  async () => {

    if (!selectedFile) return;


    transcribeButton.disabled = true;
    analyzeButton.disabled = true;

    output.value = "";
    analysisOutput.value = "";


    try {

      status.textContent =
        "Extracting audio...";


      const audio =
        await convertToWhisperAudio(
          selectedFile
        );


      if (!transcriber) {

        status.textContent =
          "Loading Whisper AI...";


        transcriber = await pipeline(
          "automatic-speech-recognition",
          "onnx-community/whisper-tiny.en",
          {
            dtype: "fp32",

            progress_callback: (data) => {

              if (
                data.status === "progress" &&
                data.progress
              ) {

                status.textContent =
                  `Loading Whisper: ${Math.round(data.progress)}%`;

              }

            }
          }
        );

      }


      status.textContent =
        "Transcribing video...";


      const result =
        await transcriber(
          audio,
          {
            chunk_length_s: 30,
            stride_length_s: 5
          }
        );


      output.value =
        result.text;


      status.textContent =
        "Transcript complete.";


      analyzeButton.disabled = false;

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "Error: " + error.message;

    }

    finally {

      transcribeButton.disabled = false;

    }

  }
);



// ------------------------------
// GENERATE KEY POINTS
// ------------------------------

analyzeButton.addEventListener(
  "click",
  async () => {

    const transcript =
      output.value.trim();


    if (!transcript) return;


    analyzeButton.disabled = true;
    analysisOutput.value = "";


    try {

      if (!analyzer) {

        analysisStatus.textContent =
          "Loading Key Points AI...";


        analyzer = await pipeline(
          "text2text-generation",
          "Xenova/flan-t5-small"
        );

      }


      analysisStatus.textContent =
        "Analyzing transcript...";


      // Keep first test reasonably small
      const textForAI =
        transcript.slice(0, 2500);


      const prompt =
        `Extract 5 important key points from this transcript. 
        Write them clearly and briefly:

        ${textForAI}`;


      const result =
        await analyzer(
          prompt,
          {
            max_new_tokens: 200
          }
        );


      analysisOutput.value =
        result[0].generated_text;


      analysisStatus.textContent =
        "Key points complete.";

    }

    catch (error) {

      console.error(error);

      analysisStatus.textContent =
        "Error: " + error.message;

    }

    finally {

      analyzeButton.disabled = false;

    }

  }
);



// ------------------------------
// GET VIDEO DURATION
// ------------------------------

function getMediaDuration(file) {

  return new Promise(
    (resolve, reject) => {

      const media =
        document.createElement(
          file.type.startsWith("video")
            ? "video"
            : "audio"
        );


      const url =
        URL.createObjectURL(file);


      media.preload =
        "metadata";


      media.onloadedmetadata = () => {

        const duration =
          media.duration;

        URL.revokeObjectURL(url);

        resolve(duration);

      };


      media.onerror = () => {

        URL.revokeObjectURL(url);

        reject(
          new Error(
            "Unsupported media file"
          )
        );

      };


      media.src = url;

    }
  );

}



// ------------------------------
// EXTRACT / CONVERT AUDIO
// ------------------------------

async function convertToWhisperAudio(file) {

  const arrayBuffer =
    await file.arrayBuffer();


  const audioContext =
    new AudioContext();


  let decodedAudio;


  try {

    decodedAudio =
      await audioContext.decodeAudioData(
        arrayBuffer.slice(0)
      );

  }

  catch (error) {

    await audioContext.close();

    throw new Error(
      "Your browser could not extract the audio from this video."
    );

  }


  const TARGET_RATE =
    16000;


  const offlineContext =
    new OfflineAudioContext(
      1,
      Math.ceil(
        decodedAudio.duration *
        TARGET_RATE
      ),
      TARGET_RATE
    );


  const source =
    offlineContext.createBufferSource();


  source.buffer =
    decodedAudio;


  source.connect(
    offlineContext.destination
  );


  source.start();


  const rendered =
    await offlineContext.startRendering();


  const audio =
    new Float32Array(
      rendered.getChannelData(0)
    );


  await audioContext.close();


  return audio;

}

</script>

</body>
</html>
