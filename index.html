<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Student Video AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
      background: #f7f7f7;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    h2 {
      margin-top: 30px;
    }

    button {
      padding: 12px 20px;
      margin-top: 15px;
      cursor: pointer;
      font-size: 16px;
    }

    input {
      margin-top: 15px;
    }

    .status {
      margin-top: 18px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 190px;
      margin-top: 15px;
      padding: 12px;
      box-sizing: border-box;
      font-size: 15px;
      line-height: 1.5;
    }

    #keyPointsOutput {
      min-height: 160px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Student Video AI</h1>

  <p>
    Upload a lesson video and generate a transcript and key points directly on your device.
  </p>

  <input
    type="file"
    id="fileInput"
    accept="video/*,audio/*"
  />

  <br>

  <button id="transcribeButton" disabled>
    Generate Transcript
  </button>

  <div id="status" class="status">
    Select a video.
  </div>


  <h2>Transcript</h2>

  <textarea
    id="transcriptOutput"
    readonly
    placeholder="Your transcript will appear here..."
  ></textarea>


  <button id="keyPointsButton" disabled>
    Generate Key Points
  </button>

  <div id="keyPointsStatus" class="status"></div>


  <h2>Key Points</h2>

  <textarea
    id="keyPointsOutput"
    readonly
    placeholder="Your key points will appear here..."
  ></textarea>

</div>


<script type="module">

import {
  pipeline
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";


const fileInput =
  document.getElementById("fileInput");

const transcribeButton =
  document.getElementById("transcribeButton");

const status =
  document.getElementById("status");

const transcriptOutput =
  document.getElementById("transcriptOutput");

const keyPointsButton =
  document.getElementById("keyPointsButton");

const keyPointsStatus =
  document.getElementById("keyPointsStatus");

const keyPointsOutput =
  document.getElementById("keyPointsOutput");


const MAX_SIZE =
  100 * 1024 * 1024;

const MAX_DURATION =
  10 * 60;


let selectedFile = null;
let transcriber = null;



// ==========================================
// SELECT VIDEO
// ==========================================

fileInput.addEventListener("change", async () => {

  transcriptOutput.value = "";
  keyPointsOutput.value = "";

  transcribeButton.disabled = true;
  keyPointsButton.disabled = true;

  selectedFile = null;

  const file = fileInput.files[0];

  if (!file) {
    status.textContent = "Select a video.";
    return;
  }


  if (file.size > MAX_SIZE) {

    status.textContent =
      "Video too large. Maximum size is 100 MB.";

    return;
  }


  status.textContent =
    "Checking video...";


  try {

    const duration =
      await getMediaDuration(file);


    if (duration > MAX_DURATION) {

      status.textContent =
        "Video too long. Maximum duration is 10 minutes.";

      return;
    }


    selectedFile = file;

    status.textContent =
      `Ready — ${Math.round(duration)} seconds`;

    transcribeButton.disabled = false;

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "Could not read this video.";

  }

});



// ==========================================
// TRANSCRIBE VIDEO
// ==========================================

transcribeButton.addEventListener(
  "click",
  async () => {

    if (!selectedFile) return;


    transcribeButton.disabled = true;
    keyPointsButton.disabled = true;

    transcriptOutput.value = "";
    keyPointsOutput.value = "";
    keyPointsStatus.textContent = "";


    try {

      status.textContent =
        "Extracting audio...";


      const audio =
        await convertToWhisperAudio(
          selectedFile
        );


      if (!transcriber) {

        status.textContent =
          "Loading Whisper AI...";


        transcriber = await pipeline(
          "automatic-speech-recognition",
          "onnx-community/whisper-tiny.en",
          {
            dtype: "fp32",

            progress_callback: (data) => {

              if (
                data.status === "progress" &&
                typeof data.progress === "number"
              ) {

                status.textContent =
                  `Loading Whisper: ${Math.round(data.progress)}%`;

              }

            }
          }
        );

      }


      status.textContent =
        "Transcribing video...";


      const result =
        await transcriber(
          audio,
          {
            chunk_length_s: 30,
            stride_length_s: 5
          }
        );


      transcriptOutput.value =
        result.text || "";


      if (!transcriptOutput.value.trim()) {

        throw new Error(
          "Whisper returned an empty transcript."
        );

      }


      status.textContent =
        "Transcript complete.";

      keyPointsButton.disabled = false;

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "Error: " + error.message;

    }

    finally {

      transcribeButton.disabled = false;

    }

  }
);



// ==========================================
// GENERATE LIGHTWEIGHT KEY POINTS
// ==========================================

keyPointsButton.addEventListener(
  "click",
  () => {

    const transcript =
      transcriptOutput.value.trim();


    if (!transcript) return;


    keyPointsStatus.textContent =
      "Finding important points...";


    try {

      const points =
        extractKeyPoints(
          transcript,
          6
        );


      if (!points.length) {

        throw new Error(
          "Could not identify enough useful sentences."
        );

      }


      keyPointsOutput.value =
        points
          .map(point => `• ${point}`)
          .join("\n\n");


      keyPointsStatus.textContent =
        "Key points complete.";

    }

    catch (error) {

      console.error(error);

      keyPointsStatus.textContent =
        "Error: " + error.message;

    }

  }
);



// ==========================================
// KEY POINT EXTRACTION
// ==========================================

function extractKeyPoints(text, maxPoints = 6) {

  const sentences =
    splitIntoSentences(text);


  if (sentences.length <= maxPoints) {

    return sentences;

  }


  const stopWords =
    new Set([
      "the","a","an","and","or","but","if","then",
      "to","of","in","on","for","with","at","by",
      "from","is","are","was","were","be","been",
      "being","it","its","this","that","these",
      "those","i","you","he","she","we","they",
      "them","our","your","their","my","me",
      "as","so","do","does","did","have","has",
      "had","will","would","can","could","should",
      "about","into","than","too","very","just",
      "also","more","some","any","not","no",
      "yes","yeah","oh"
    ]);


  const wordFrequency = {};


  for (const sentence of sentences) {

    const words =
      tokenize(sentence);


    for (const word of words) {

      if (
        word.length < 3 ||
        stopWords.has(word)
      ) {
        continue;
      }


      wordFrequency[word] =
        (wordFrequency[word] || 0) + 1;

    }

  }


  const scored =
    sentences.map(
      (sentence, index) => {

        const words =
          tokenize(sentence);


        let score = 0;


        for (const word of words) {

          if (
            !stopWords.has(word) &&
            wordFrequency[word]
          ) {

            score +=
              wordFrequency[word];

          }

        }


        // Important numbers often matter
        if (/\d/.test(sentence)) {
          score += 4;
        }


        // Names / capitalized terms
        const capitals =
          sentence.match(
            /\b[A-Z][a-zA-Z0-9.-]+\b/g
          );


        if (capitals) {
          score +=
            Math.min(capitals.length, 4);
        }


        // Announcement / future-plan words
        if (
          /\b(launch|release|open|open-source|open sourcing|announce|announced|coming|plan|planning|future|new|latest|model|weights|agent|will|going to)\b/i.test(
            sentence
          )
        ) {

          score += 4;

        }


        // Avoid tiny sentences
        if (words.length < 5) {
          score -= 5;
        }


        // Avoid extremely long sentences
        if (words.length > 45) {
          score -= 2;
        }


        return {
          sentence,
          score,
          index
        };

      }
    );


  scored.sort(
    (a, b) =>
      b.score - a.score
  );


  const selected = [];


  for (const candidate of scored) {

    const tooSimilar =
      selected.some(
        item =>
          sentenceSimilarity(
            item.sentence,
            candidate.sentence
          ) > 0.65
      );


    if (!tooSimilar) {

      selected.push(candidate);

    }


    if (
      selected.length >= maxPoints
    ) {
      break;
    }

  }


  // Put selected points back into original order
  selected.sort(
    (a, b) =>
      a.index - b.index
  );


  return selected.map(
    item =>
      cleanSentence(
        item.sentence
      )
  );

}



// ==========================================
// SENTENCE SPLITTING
// ==========================================

function splitIntoSentences(text) {

  return text
    .replace(/\s+/g, " ")
    .trim()
    .match(
      /[^.!?]+[.!?]+|[^.!?]+$/g
    )
    ?.map(
      sentence =>
        sentence.trim()
    )
    .filter(
      sentence =>
        sentence.length > 20
    ) || [];

}



// ==========================================
// WORD TOKENIZER
// ==========================================

function tokenize(text) {

  return text
    .toLowerCase()
    .replace(
      /[^a-z0-9'-]/g,
      " "
    )
    .split(/\s+/)
    .filter(Boolean);

}



// ==========================================
// REMOVE DUPLICATE-LIKE POINTS
// ==========================================

function sentenceSimilarity(
  sentenceA,
  sentenceB
) {

  const wordsA =
    new Set(
      tokenize(sentenceA)
    );

  const wordsB =
    new Set(
      tokenize(sentenceB)
    );


  const intersection =
    [...wordsA].filter(
      word =>
        wordsB.has(word)
    ).length;


  const union =
    new Set([
      ...wordsA,
      ...wordsB
    ]).size;


  if (!union) {
    return 0;
  }


  return intersection / union;

}



// ==========================================
// CLEAN SENTENCE
// ==========================================

function cleanSentence(sentence) {

  let cleaned =
    sentence
      .replace(/\s+/g, " ")
      .trim();


  if (
    cleaned.length > 260
  ) {

    cleaned =
      cleaned.slice(0, 257)
      .trim() + "...";

  }


  return cleaned;

}



// ==========================================
// GET VIDEO DURATION
// ==========================================

function getMediaDuration(file) {

  return new Promise(
    (resolve, reject) => {

      const media =
        document.createElement(
          file.type.startsWith("video")
            ? "video"
            : "audio"
        );


      const url =
        URL.createObjectURL(file);


      media.preload =
        "metadata";


      media.onloadedmetadata = () => {

        const duration =
          media.duration;

        URL.revokeObjectURL(url);

        resolve(duration);

      };


      media.onerror = () => {

        URL.revokeObjectURL(url);

        reject(
          new Error(
            "Unsupported media file."
          )
        );

      };


      media.src = url;

    }
  );

}



// ==========================================
// CONVERT VIDEO AUDIO FOR WHISPER
// ==========================================

async function convertToWhisperAudio(file) {

  const arrayBuffer =
    await file.arrayBuffer();


  const audioContext =
    new AudioContext();


  let decodedAudio;


  try {

    decodedAudio =
      await audioContext.decodeAudioData(
        arrayBuffer.slice(0)
      );

  }

  catch (error) {

    await audioContext.close();

    throw new Error(
      "Your browser could not extract audio from this video."
    );

  }


  const TARGET_RATE =
    16000;


  const offlineContext =
    new OfflineAudioContext(
      1,
      Math.ceil(
        decodedAudio.duration *
        TARGET_RATE
      ),
      TARGET_RATE
    );


  const source =
    offlineContext.createBufferSource();


  source.buffer =
    decodedAudio;


  source.connect(
    offlineContext.destination
  );


  source.start();


  const rendered =
    await offlineContext.startRendering();


  const audio =
    new Float32Array(
      rendered.getChannelData(0)
    );


  await audioContext.close();


  return audio;

}

</script>

</body>
</html>
