<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Video AI</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 900px;
  margin: 40px auto;
  padding: 20px;
  background: #f7f7f7;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

h1 { margin-top: 0; }
h2 { margin-top: 32px; }

button {
  padding: 12px 20px;
  margin-top: 15px;
  cursor: pointer;
  font-size: 16px;
}

input {
  margin-top: 15px;
}

.status {
  margin-top: 18px;
  font-weight: bold;
}

textarea {
  width: 100%;
  min-height: 210px;
  margin-top: 15px;
  padding: 14px;
  box-sizing: border-box;
  font-size: 15px;
  line-height: 1.6;
}

#keyPointsOutput {
  min-height: 180px;
}

.question {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 18px;
  margin: 20px 0;
}

.question-title {
  font-weight: bold;
  margin-bottom: 15px;
  line-height: 1.5;
}

.answer {
  display: block;
  width: 100%;
  text-align: left;
  padding: 11px 14px;
  margin: 8px 0;
  background: white;
  border: 1px solid #ccc;
  border-radius: 8px;
  cursor: pointer;
}

.answer.correct {
  border: 2px solid #111;
  font-weight: bold;
}

.answer.wrong {
  text-decoration: line-through;
  opacity: 0.55;
}

.result {
  margin-top: 12px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

<h1>Student Video AI</h1>

<p>
Upload a lesson video and generate a transcript,
key points and revision quiz directly on your device.
</p>

<input
  type="file"
  id="fileInput"
  accept="video/*,audio/*"
>

<br>

<button id="transcribeButton" disabled>
  Generate Transcript
</button>

<div id="status" class="status">
  Select a video.
</div>


<h2>Timestamped Transcript</h2>

<textarea
  id="transcriptOutput"
  readonly
  placeholder="Your transcript will appear here..."
></textarea>


<button id="keyPointsButton" disabled>
  Generate Key Points
</button>

<div
  id="keyPointsStatus"
  class="status">
</div>


<h2>Key Points</h2>

<textarea
  id="keyPointsOutput"
  readonly
  placeholder="Your key points will appear here..."
></textarea>


<button id="quizButton" disabled>
  Generate Quiz
</button>

<div
  id="quizStatus"
  class="status">
</div>


<h2>Revision Quiz</h2>

<div id="quizContainer"></div>

</div>


<script type="module">

import {
  pipeline
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";


const fileInput =
  document.getElementById("fileInput");

const transcribeButton =
  document.getElementById("transcribeButton");

const status =
  document.getElementById("status");

const transcriptOutput =
  document.getElementById("transcriptOutput");

const keyPointsButton =
  document.getElementById("keyPointsButton");

const keyPointsStatus =
  document.getElementById("keyPointsStatus");

const keyPointsOutput =
  document.getElementById("keyPointsOutput");

const quizButton =
  document.getElementById("quizButton");

const quizStatus =
  document.getElementById("quizStatus");

const quizContainer =
  document.getElementById("quizContainer");


const MAX_SIZE =
  100 * 1024 * 1024;

const MAX_DURATION =
  10 * 60;


let selectedFile = null;
let transcriber = null;

let rawTranscript = "";
let currentKeyPoints = [];



// =====================================
// SELECT FILE
// =====================================

fileInput.addEventListener(
  "change",
  async () => {

    resetResults();

    const file =
      fileInput.files[0];

    if (!file) {
      return;
    }


    if (file.size > MAX_SIZE) {

      status.textContent =
        "Video too large. Maximum size is 100 MB.";

      return;
    }


    status.textContent =
      "Checking video...";


    try {

      const duration =
        await getMediaDuration(file);


      if (duration > MAX_DURATION) {

        status.textContent =
          "Video too long. Maximum duration is 10 minutes.";

        return;
      }


      selectedFile = file;

      status.textContent =
        `Ready — ${Math.round(duration)} seconds`;

      transcribeButton.disabled =
        false;

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "Could not read this video.";
    }

  }
);



// =====================================
// RESET
// =====================================

function resetResults() {

  selectedFile = null;

  rawTranscript = "";
  currentKeyPoints = [];

  transcriptOutput.value = "";
  keyPointsOutput.value = "";

  quizContainer.innerHTML = "";

  keyPointsStatus.textContent = "";
  quizStatus.textContent = "";

  transcribeButton.disabled = true;
  keyPointsButton.disabled = true;
  quizButton.disabled = true;

}



// =====================================
// TRANSCRIBE
// =====================================

transcribeButton.addEventListener(
  "click",
  async () => {

    if (!selectedFile) return;


    transcribeButton.disabled = true;
    keyPointsButton.disabled = true;
    quizButton.disabled = true;

    transcriptOutput.value = "";
    keyPointsOutput.value = "";

    quizContainer.innerHTML = "";

    rawTranscript = "";
    currentKeyPoints = [];


    try {

      status.textContent =
        "Extracting audio...";


      const audio =
        await convertToWhisperAudio(
          selectedFile
        );


      if (!transcriber) {

        status.textContent =
          "Loading Whisper AI...";


        transcriber = await pipeline(
          "automatic-speech-recognition",
          "onnx-community/whisper-tiny.en",
          {
            dtype: "fp32",

            progress_callback: (data) => {

              if (
                data.status === "progress" &&
                typeof data.progress === "number"
              ) {

                status.textContent =
                  `Loading Whisper: ${Math.round(data.progress)}%`;
              }

            }
          }
        );
      }


      status.textContent =
        "Transcribing video...";


      const result =
        await transcriber(
          audio,
          {
            chunk_length_s: 30,
            stride_length_s: 5,
            return_timestamps: true
          }
        );


      rawTranscript =
        result.text?.trim() || "";


      if (!rawTranscript) {

        throw new Error(
          "Whisper returned an empty transcript."
        );
      }


      transcriptOutput.value =
        formatTimestampedTranscript(
          result
        );


      status.textContent =
        "Transcript complete.";


      keyPointsButton.disabled =
        false;

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "Error: " + error.message;

    }

    finally {

      transcribeButton.disabled =
        false;
    }

  }
);



// =====================================
// TIMESTAMPS
// =====================================

function formatTimestampedTranscript(
  result
) {

  if (
    !result.chunks ||
    !result.chunks.length
  ) {

    return result.text || "";
  }


  return result.chunks
    .map(chunk => {

      const start =
        chunk.timestamp?.[0] ?? 0;

      const end =
        chunk.timestamp?.[1];


      const startText =
        formatTime(start);

      const endText =
        typeof end === "number"
          ? formatTime(end)
          : "--:--";


      return (
        `[${startText} - ${endText}]\n` +
        `${chunk.text?.trim() || ""}`
      );

    })
    .join("\n\n");

}



function formatTime(seconds) {

  const total =
    Math.max(
      0,
      Math.floor(seconds)
    );

  const minutes =
    Math.floor(total / 60);

  const secs =
    total % 60;


  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );

}



// =====================================
// KEY POINTS
// =====================================

keyPointsButton.addEventListener(
  "click",
  () => {

    if (!rawTranscript) return;


    try {

      keyPointsStatus.textContent =
        "Finding important points...";


      currentKeyPoints =
        extractKeyPoints(
          rawTranscript,
          6
        );


      keyPointsOutput.value =
        currentKeyPoints
          .map(point =>
            `• ${point}`
          )
          .join("\n\n");


      keyPointsStatus.textContent =
        "Key points complete.";


      quizButton.disabled =
        currentKeyPoints.length === 0;

    }

    catch (error) {

      console.error(error);

      keyPointsStatus.textContent =
        "Error: " + error.message;
    }

  }
);



// =====================================
// KEY POINT EXTRACTION
// =====================================

function extractKeyPoints(
  text,
  maxPoints = 6
) {

  let candidates = [];


  for (
    const sentence of
    splitIntoSentences(text)
  ) {

    candidates.push(
      ...splitLongSentence(sentence)
    );
  }


  candidates =
    candidates
      .map(cleanCandidate)
      .filter(item =>
        item.length >= 25
      );


  const stopWords =
    new Set([
      "the","a","an","and","or","but",
      "if","then","to","of","in","on",
      "for","with","at","by","from",
      "is","are","was","were","be",
      "been","being","it","its","this",
      "that","these","those","i","you",
      "he","she","we","they","them",
      "our","your","their","my","me",
      "as","so","do","does","did",
      "have","has","had","can","could",
      "would","should","very","just",
      "also","more","some","yeah","oh",
      "um","uh","well","actually"
    ]);


  const frequency = {};


  for (const sentence of candidates) {

    for (
      const word of
      tokenize(sentence)
    ) {

      if (
        word.length < 3 ||
        stopWords.has(word)
      ) {
        continue;
      }


      frequency[word] =
        (frequency[word] || 0) + 1;
    }
  }


  const scored =
    candidates.map(
      (sentence, index) => {

        const words =
          tokenize(sentence);

        let score = 0;


        for (const word of words) {

          if (
            !stopWords.has(word) &&
            frequency[word]
          ) {

            score += frequency[word];
          }
        }


        score /=
          Math.sqrt(
            Math.max(
              words.length,
              1
            )
          );


        if (/\d/.test(sentence)) {
          score += 5;
        }


        if (
          /\b(new|model|weights|release|launch|open-source|open sourcing|study|research|result|future|coming|agent|available|latest|highest|first)\b/i.test(
            sentence
          )
        ) {

          score += 5;
        }


        if (index <= 2) {
          score += 2;
        }


        if (sentence.endsWith("?")) {
          score -= 8;
        }


        return {
          text: sentence,
          score,
          index
        };

      }
    );


  scored.sort(
    (a, b) =>
      b.score - a.score
  );


  const selected = [];


  for (const candidate of scored) {

    const duplicate =
      selected.some(item =>
        similarity(
          item.text,
          candidate.text
        ) > 0.58
      );


    if (!duplicate) {

      selected.push(candidate);
    }


    if (
      selected.length >=
      maxPoints
    ) {
      break;
    }
  }


  selected.sort(
    (a, b) =>
      a.index - b.index
  );


  return selected.map(
    item =>
      makeConcisePoint(
        item.text
      )
  );

}



// =====================================
// QUIZ
// =====================================

quizButton.addEventListener(
  "click",
  () => {

    quizContainer.innerHTML = "";


    try {

      quizStatus.textContent =
        "Generating quiz...";


      const questions =
        generateQuiz(
          rawTranscript,
          currentKeyPoints,
          5
        );


      if (!questions.length) {

        throw new Error(
          "Not enough useful facts to create a quiz."
        );
      }


      renderQuiz(questions);


      quizStatus.textContent =
        `${questions.length} questions ready.`;

    }

    catch (error) {

      console.error(error);

      quizStatus.textContent =
        "Error: " + error.message;
    }

  }
);



// =====================================
// BETTER QUIZ GENERATOR
// =====================================

function generateQuiz(
  transcript,
  points,
  maxQuestions
) {

  const terms =
    extractTerms(transcript);


  const usedAnswers =
    new Set();

  const questions = [];


  for (const point of points) {

    const matching =
      terms.filter(term =>
        point.toLowerCase().includes(
          term.value.toLowerCase()
        )
      );


    matching.sort(
      (a, b) =>
        termScore(b) -
        termScore(a)
    );


    for (const term of matching) {

      const key =
        term.value.toLowerCase();


      if (
        usedAnswers.has(key)
      ) {
        continue;
      }


      let distractors = [];


      if (term.type === "number") {

        /*
          Don't create awkward questions
          from values such as 24-7.
        */

        if (
          !/^\d+(?:\.\d+)?$/.test(
            term.value
          )
        ) {
          continue;
        }


        distractors =
          createNumberDistractors(
            term.value
          );

      }

      else {

        distractors =
          terms
            .filter(other =>
              other.type === "name" &&
              other.value.toLowerCase() !==
                key
            )
            .map(item =>
              item.value
            );


        distractors =
          unique(
            distractors
          )
          .filter(value =>
            !tooSimilarTerms(
              value,
              term.value
            )
          )
          .slice(0, 3);


        /*
          3-answer questions are okay.
          Don't invent fake names just
          to reach four choices.
        */

        if (
          distractors.length < 2
        ) {
          continue;
        }
      }


      const blanked =
        replaceFirstInsensitive(
          point,
          term.value,
          "________"
        );


      if (
        blanked === point
      ) {
        continue;
      }


      const options =
        shuffle([
          term.value,
          ...distractors
        ]);


      questions.push({

        question:
          createQuestionText(
            blanked,
            term
          ),

        correct:
          term.value,

        options
      });


      usedAnswers.add(key);

      break;
    }


    if (
      questions.length >=
      maxQuestions
    ) {
      break;
    }
  }


  return questions;

}



// =====================================
// QUESTION TEXT
// =====================================

function createQuestionText(
  blanked,
  term
) {

  if (
    term.type === "number"
  ) {

    return (
      "Which number correctly completes this statement?\n\n" +
      blanked
    );
  }


  return (
    "Which name or term correctly completes this statement?\n\n" +
    blanked
  );

}



// =====================================
// EXTRACT QUIZ TERMS
// =====================================

function extractTerms(text) {

  const terms = [];

  const seen =
    new Set();


  function addTerm(
    value,
    type
  ) {

    value =
      value
        .replace(/[.,!?;:]+$/g, "")
        .trim();


    if (
      value.length < 2
    ) {
      return;
    }


    const key =
      `${type}:${value.toLowerCase()}`;


    if (
      seen.has(key)
    ) {
      return;
    }


    seen.add(key);


    terms.push({
      value,
      type
    });
  }


  // -----------------------------
  // NUMBERS
  // -----------------------------

  const numbers =
    text.match(
      /\b\d+(?:\.\d+)?(?:-\d+)?\b/g
    ) || [];


  for (
    const number of numbers
  ) {

    addTerm(
      number,
      "number"
    );
  }


  // -----------------------------
  // NAMES
  // -----------------------------

  const ignore =
    new Set([
      "The","This","That","These",
      "Those","We","We're","I",
      "I'm","You","It","It's",
      "They","And","But","So",
      "In","On","At","For","From"
    ]);


  const sentences =
    splitIntoSentences(text);


  for (
    const sentence of sentences
  ) {

    /*
      Examples detected:

      Muse Glimmer
      Muse Spark 1.2
      Meta AI
      USA

      Importantly this cannot cross
      punctuation into "Muse Glimmer. It".
    */

    const matches =
      sentence.match(
        /\b[A-Z][A-Za-z0-9-]*(?:\s+(?:[A-Z][A-Za-z0-9-]*|\d+(?:\.\d+)?)){0,3}\b/g
      ) || [];


    for (
      let name of matches
    ) {

      name =
        name.trim();


      if (
        ignore.has(name)
      ) {
        continue;
      }


      /*
        Ignore most ordinary
        single sentence-start words.
      */

      if (
        !name.includes(" ") &&
        name.length < 4 &&
        !/^[A-Z]{2,}$/.test(name)
      ) {
        continue;
      }


      addTerm(
        name,
        "name"
      );
    }
  }


  return terms;

}



// =====================================
// TERM IMPORTANCE
// =====================================

function termScore(term) {

  let score = 0;


  if (
    term.type === "number"
  ) {
    score += 6;
  }


  if (
    term.value.includes(" ")
  ) {
    score += 5;
  }


  if (
    /^[A-Z]{2,}/.test(
      term.value
    )
  ) {
    score += 3;
  }


  score +=
    Math.min(
      term.value.length / 10,
      3
    );


  return score;

}



// =====================================
// NUMBER DISTRACTORS
// =====================================

function createNumberDistractors(
  value
) {

  const number =
    Number(value);


  if (
    !Number.isFinite(number)
  ) {

    return [];
  }


  let candidates = [];


  // Year-like value

  if (
    Number.isInteger(number) &&
    number >= 1900 &&
    number <= 2100
  ) {

    candidates = [
      number - 1,
      number + 1,
      number + 2
    ];
  }


  // Decimal: 1.2 → 1.0 / 1.1 / 1.3

  else if (
    value.includes(".")
  ) {

    const decimals =
      value.split(".")[1].length;

    const step =
      1 / Math.pow(
        10,
        decimals
      );


    candidates = [
      number - (step * 2),
      number - step,
      number + step,
      number + (step * 2)
    ]
      .filter(item =>
        item > 0
      )
      .slice(0, 3)
      .map(item =>
        item.toFixed(decimals)
      );


    return candidates;
  }


  // Normal numbers

  else {

    let step;


    if (number <= 10) {
      step = 1;
    }

    else if (number <= 50) {
      step = 5;
    }

    else if (number <= 200) {
      step = 10;
    }

    else {
      step =
        Math.max(
          10,
          Math.round(
            number * 0.1
          )
        );
    }


    candidates = [
      number - (step * 2),
      number - step,
      number + step,
      number + (step * 2)
    ]
      .filter(item =>
        item > 0 &&
        item !== number
      )
      .slice(0, 3);
  }


  return candidates.map(
    item =>
      String(item)
  );

}



// =====================================
// RENDER QUIZ
// =====================================

function renderQuiz(
  questions
) {

  questions.forEach(
    (question, index) => {

      const box =
        document.createElement(
          "div"
        );


      box.className =
        "question";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "question-title";


      title.textContent =
        `Question ${index + 1}: ${question.question}`;


      box.appendChild(title);


      const result =
        document.createElement(
          "div"
        );


      result.className =
        "result";


      question.options.forEach(
        option => {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "answer";


          button.textContent =
            option;


          button.onclick = () => {

            const buttons =
              box.querySelectorAll(
                ".answer"
              );


            buttons.forEach(
              item => {

                item.disabled = true;


                if (
                  item.textContent ===
                  question.correct
                ) {

                  item.classList.add(
                    "correct"
                  );
                }

              }
            );


            if (
              option ===
              question.correct
            ) {

              result.textContent =
                "Correct.";
            }

            else {

              button.classList.add(
                "wrong"
              );


              result.textContent =
                `Correct answer: ${question.correct}`;
            }

          };


          box.appendChild(button);

        }
      );


      box.appendChild(result);


      quizContainer.appendChild(
        box
      );

    }
  );

}



// =====================================
// TEXT HELPERS
// =====================================

function splitIntoSentences(text) {

  const normalized =
    text
      .replace(/\s+/g, " ")
      .trim();


  if (
    Intl &&
    Intl.Segmenter
  ) {

    try {

      const segmenter =
        new Intl.Segmenter(
          "en",
          {
            granularity:
              "sentence"
          }
        );


      return [
        ...segmenter.segment(
          normalized
        )
      ]
        .map(item =>
          item.segment.trim()
        )
        .filter(item =>
          item.length > 15
        );

    }

    catch {}
  }


  const protectedText =
    normalized.replace(
      /(\d)\.(\d)/g,
      "$1__DOT__$2"
    );


  return (
    protectedText.match(
      /[^.!?]+[.!?]+|[^.!?]+$/g
    ) || []
  )
    .map(item =>
      item
        .replace(
          /__DOT__/g,
          "."
        )
        .trim()
    );

}



function splitLongSentence(
  sentence
) {

  if (
    sentence.length < 210
  ) {

    return [sentence];
  }


  return sentence
    .split(
      /;\s+|,\s+(?=(?:and|but|while|because|so)\s+)/i
    )
    .map(item =>
      item.trim()
    )
    .filter(item =>
      item.length > 25
    );

}



function cleanCandidate(text) {

  return text
    .replace(/\s+/g, " ")
    .replace(
      /^(yeah|oh|um|uh|well|okay|ok|right|basically|actually)[,.]?\s+/i,
      ""
    )
    .replace(
      /^I(?:'m| am) (?:proud|happy|excited) to (?:share|announce) that\s+/i,
      ""
    )
    .replace(
      /\s+and I(?:'m| am) looking forward to sharing more soon\.?$/i,
      ""
    )
    .trim();

}



function makeConcisePoint(text) {

  let point =
    cleanCandidate(text);


  if (
    point.length > 220
  ) {

    point =
      point
        .slice(0, 210)
        .trim() +
      "...";
  }


  return (
    point.charAt(0).toUpperCase() +
    point.slice(1)
  );

}



function tokenize(text) {

  return text
    .toLowerCase()
    .replace(
      /[^a-z0-9'.-]/g,
      " "
    )
    .split(/\s+/)
    .filter(Boolean);

}



function similarity(a, b) {

  const A =
    new Set(
      tokenize(a)
    );

  const B =
    new Set(
      tokenize(b)
    );


  const common =
    [...A]
      .filter(item =>
        B.has(item)
      )
      .length;


  const union =
    new Set([
      ...A,
      ...B
    ]).size;


  return union
    ? common / union
    : 0;

}



function tooSimilarTerms(
  a,
  b
) {

  const A =
    a.toLowerCase();

  const B =
    b.toLowerCase();


  return (
    A === B ||
    A.includes(B) ||
    B.includes(A)
  );

}



function replaceFirstInsensitive(
  text,
  search,
  replacement
) {

  const escaped =
    search.replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );


  return text.replace(
    new RegExp(
      escaped,
      "i"
    ),
    replacement
  );

}



function unique(array) {

  return [
    ...new Set(array)
  ];

}



function shuffle(array) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];
  }


  return result;

}



// =====================================
// MEDIA
// =====================================

function getMediaDuration(file) {

  return new Promise(
    (resolve, reject) => {

      const media =
        document.createElement(
          file.type.startsWith("video")
            ? "video"
            : "audio"
        );


      const url =
        URL.createObjectURL(file);


      media.preload =
        "metadata";


      media.onloadedmetadata = () => {

        const duration =
          media.duration;


        URL.revokeObjectURL(url);

        resolve(duration);
      };


      media.onerror = () => {

        URL.revokeObjectURL(url);

        reject(
          new Error(
            "Unsupported media file."
          )
        );
      };


      media.src = url;

    }
  );

}



// =====================================
// AUDIO → WHISPER
// =====================================

async function convertToWhisperAudio(
  file
) {

  const arrayBuffer =
    await file.arrayBuffer();


  const audioContext =
    new AudioContext();


  let decodedAudio;


  try {

    decodedAudio =
      await audioContext.decodeAudioData(
        arrayBuffer.slice(0)
      );

  }

  catch {

    await audioContext.close();


    throw new Error(
      "Your browser could not extract audio from this video."
    );
  }


  const TARGET_RATE =
    16000;


  const offlineContext =
    new OfflineAudioContext(
      1,
      Math.ceil(
        decodedAudio.duration *
        TARGET_RATE
      ),
      TARGET_RATE
    );


  const source =
    offlineContext.createBufferSource();


  source.buffer =
    decodedAudio;


  source.connect(
    offlineContext.destination
  );


  source.start();


  const rendered =
    await offlineContext.startRendering();


  const audio =
    new Float32Array(
      rendered.getChannelData(0)
    );


  await audioContext.close();


  return audio;

}
