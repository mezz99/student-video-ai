<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Video AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f7f7f7;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    h2 {
      margin-top: 32px;
    }

    button {
      padding: 12px 20px;
      margin-top: 15px;
      cursor: pointer;
      font-size: 16px;
    }

    input {
      margin-top: 15px;
    }

    .status {
      margin-top: 18px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 210px;
      margin-top: 15px;
      padding: 14px;
      box-sizing: border-box;
      font-size: 15px;
      line-height: 1.6;
    }

    #keyPointsOutput {
      min-height: 180px;
    }

    #quizContainer {
      margin-top: 20px;
    }

    .question {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .question-title {
      font-weight: bold;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .answer {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    .answer:disabled {
      cursor: default;
    }

    .correct {
      border: 2px solid #222;
      font-weight: bold;
    }

    .wrong {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .result {
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Student Video AI</h1>

  <p>
    Upload a lesson video and generate a transcript, key points and revision quiz directly on your device.
  </p>

  <input
    type="file"
    id="fileInput"
    accept="video/*,audio/*"
  >

  <br>

  <button id="transcribeButton" disabled>
    Generate Transcript
  </button>

  <div id="status" class="status">
    Select a video.
  </div>


  <h2>Timestamped Transcript</h2>

  <textarea
    id="transcriptOutput"
    readonly
    placeholder="Your transcript will appear here..."
  ></textarea>


  <button id="keyPointsButton" disabled>
    Generate Key Points
  </button>

  <div id="keyPointsStatus" class="status"></div>


  <h2>Key Points</h2>

  <textarea
    id="keyPointsOutput"
    readonly
    placeholder="Your key points will appear here..."
  ></textarea>


  <button id="quizButton" disabled>
    Generate Quiz
  </button>

  <div id="quizStatus" class="status"></div>


  <h2>Revision Quiz</h2>

  <div id="quizContainer"></div>

</div>


<script type="module">

import {
  pipeline
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";


const fileInput =
  document.getElementById("fileInput");

const transcribeButton =
  document.getElementById("transcribeButton");

const status =
  document.getElementById("status");

const transcriptOutput =
  document.getElementById("transcriptOutput");

const keyPointsButton =
  document.getElementById("keyPointsButton");

const keyPointsStatus =
  document.getElementById("keyPointsStatus");

const keyPointsOutput =
  document.getElementById("keyPointsOutput");

const quizButton =
  document.getElementById("quizButton");

const quizStatus =
  document.getElementById("quizStatus");

const quizContainer =
  document.getElementById("quizContainer");


const MAX_SIZE =
  100 * 1024 * 1024;

const MAX_DURATION =
  10 * 60;


let selectedFile = null;

let transcriber = null;

let rawTranscript = "";

let currentKeyPoints = [];



// ==========================================
// SELECT FILE
// ==========================================

fileInput.addEventListener(
  "change",
  async () => {

    transcriptOutput.value = "";
    keyPointsOutput.value = "";

    quizContainer.innerHTML = "";

    rawTranscript = "";
    currentKeyPoints = [];

    transcribeButton.disabled = true;
    keyPointsButton.disabled = true;
    quizButton.disabled = true;

    selectedFile = null;


    const file =
      fileInput.files[0];


    if (!file) {

      status.textContent =
        "Select a video.";

      return;

    }


    if (file.size > MAX_SIZE) {

      status.textContent =
        "Video too large. Maximum size is 100 MB.";

      return;

    }


    status.textContent =
      "Checking video...";


    try {

      const duration =
        await getMediaDuration(file);


      if (duration > MAX_DURATION) {

        status.textContent =
          "Video too long. Maximum duration is 10 minutes.";

        return;

      }


      selectedFile = file;


      status.textContent =
        `Ready — ${Math.round(duration)} seconds`;


      transcribeButton.disabled = false;

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "Could not read this video.";

    }

  }
);



// ==========================================
// TRANSCRIBE
// ==========================================

transcribeButton.addEventListener(
  "click",
  async () => {

    if (!selectedFile) return;


    transcribeButton.disabled = true;
    keyPointsButton.disabled = true;
    quizButton.disabled = true;

    transcriptOutput.value = "";
    keyPointsOutput.value = "";

    quizContainer.innerHTML = "";

    rawTranscript = "";
    currentKeyPoints = [];

    keyPointsStatus.textContent = "";
    quizStatus.textContent = "";


    try {

      status.textContent =
        "Extracting audio...";


      const audio =
        await convertToWhisperAudio(
          selectedFile
        );


      if (!transcriber) {

        status.textContent =
          "Loading Whisper AI...";


        transcriber = await pipeline(
          "automatic-speech-recognition",
          "onnx-community/whisper-tiny.en",
          {
            dtype: "fp32",

            progress_callback: (data) => {

              if (
                data.status === "progress" &&
                typeof data.progress === "number"
              ) {

                status.textContent =
                  `Loading Whisper: ${Math.round(data.progress)}%`;

              }

            }
          }
        );

      }


      status.textContent =
        "Transcribing video...";


      const result =
        await transcriber(
          audio,
          {
            chunk_length_s: 30,
            stride_length_s: 5,
            return_timestamps: true
          }
        );


      rawTranscript =
        result.text?.trim() || "";


      if (!rawTranscript) {

        throw new Error(
          "Whisper returned an empty transcript."
        );

      }


      transcriptOutput.value =
        formatTimestampedTranscript(
          result
        );


      status.textContent =
        "Transcript complete.";


      keyPointsButton.disabled = false;

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "Error: " + error.message;

    }

    finally {

      transcribeButton.disabled = false;

    }

  }
);



// ==========================================
// TIMESTAMPED TRANSCRIPT
// ==========================================

function formatTimestampedTranscript(result) {

  if (
    !result.chunks ||
    !result.chunks.length
  ) {

    return result.text || "";

  }


  return result.chunks
    .map(chunk => {

      const start =
        chunk.timestamp?.[0] ?? 0;

      const end =
        chunk.timestamp?.[1];


      const startText =
        formatTime(start);


      const endText =
        typeof end === "number"
          ? formatTime(end)
          : "--:--";


      const text =
        chunk.text?.trim() || "";


      return (
        `[${startText} - ${endText}]\n` +
        text
      );

    })
    .join("\n\n");

}



function formatTime(seconds) {

  const total =
    Math.max(
      0,
      Math.floor(seconds)
    );


  const minutes =
    Math.floor(total / 60);


  const secs =
    total % 60;


  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );

}



// ==========================================
// KEY POINTS
// ==========================================

keyPointsButton.addEventListener(
  "click",
  () => {

    if (!rawTranscript) return;


    keyPointsStatus.textContent =
      "Finding important points...";


    try {

      currentKeyPoints =
        extractKeyPoints(
          rawTranscript,
          6
        );


      if (!currentKeyPoints.length) {

        throw new Error(
          "Could not find useful key points."
        );

      }


      keyPointsOutput.value =
        currentKeyPoints
          .map(point =>
            `• ${point}`
          )
          .join("\n\n");


      keyPointsStatus.textContent =
        "Key points complete.";


      quizButton.disabled = false;

    }

    catch (error) {

      console.error(error);

      keyPointsStatus.textContent =
        "Error: " + error.message;

    }

  }
);



// ==========================================
// QUIZ
// ==========================================

quizButton.addEventListener(
  "click",
  () => {

    quizContainer.innerHTML = "";

    quizStatus.textContent =
      "Generating revision questions...";


    try {

      const questions =
        generateQuiz(
          rawTranscript,
          currentKeyPoints,
          5
        );


      if (!questions.length) {

        throw new Error(
          "Not enough useful information to create a quiz."
        );

      }


      renderQuiz(
        questions
      );


      quizStatus.textContent =
        `${questions.length} questions ready.`;

    }

    catch (error) {

      console.error(error);

      quizStatus.textContent =
        "Error: " + error.message;

    }

  }
);



// ==========================================
// GENERATE MCQ QUESTIONS
// ==========================================

function generateQuiz(
  transcript,
  keyPoints,
  maxQuestions = 5
) {

  const terms =
    extractImportantTerms(
      transcript
    );


  const questions = [];


  for (const point of keyPoints) {

    const matchingTerms =
      terms.filter(term =>
        point
          .toLowerCase()
          .includes(
            term.toLowerCase()
          )
      );


    if (!matchingTerms.length) {
      continue;
    }


    /*
      Prefer numbers and named terms.
    */

    matchingTerms.sort(
      (a, b) =>
        termImportance(b) -
        termImportance(a)
    );


    const correct =
      matchingTerms[0];


    if (
      !correct ||
      correct.length < 2
    ) {
      continue;
    }


    const questionText =
      replaceFirstInsensitive(
        point,
        correct,
        "________"
      );


    if (
      questionText === point
    ) {
      continue;
    }


    const distractorPool =
      terms.filter(term =>
        term.toLowerCase() !==
        correct.toLowerCase()
      );


    const distractors =
      chooseDistractors(
        correct,
        distractorPool,
        3
      );


    if (
      distractors.length < 3
    ) {
      continue;
    }


    const answers =
      shuffle([
        correct,
        ...distractors
      ]);


    questions.push({
      question:
        `Complete the statement:\n${questionText}`,
      correct,
      answers
    });


    if (
      questions.length >=
      maxQuestions
    ) {
      break;
    }

  }


  return questions;

}



// ==========================================
// IMPORTANT TERMS
// ==========================================

function extractImportantTerms(text) {

  const results =
    new Set();


  /*
    Numbers:
    30
    24-7
    1.2
    2026
  */

  const numbers =
    text.match(
      /\b\d+(?:\.\d+)?(?:-\d+)?\b/g
    ) || [];


  for (const number of numbers) {

    results.add(number);

  }


  /*
    Capitalized names / phrases.

    Examples:
    Muse Glimmer
    Muse Spark
    Meta AI
  */

  const names =
    text.match(
      /\b(?:[A-Z][A-Za-z0-9.-]*)(?:\s+[A-Z][A-Za-z0-9.-]*){0,3}\b/g
    ) || [];


  for (let name of names) {

    name =
      name.trim();


    if (
      name.length >= 3 &&
      ![
        "The",
        "This",
        "That",
        "You",
        "We",
        "They",
        "It",
        "In",
        "And",
        "But"
      ].includes(name)
    ) {

      results.add(name);

    }

  }


  return [...results];

}



// ==========================================
// TERM IMPORTANCE
// ==========================================

function termImportance(term) {

  let score = 0;


  if (
    /\d/.test(term)
  ) {

    score += 5;

  }


  if (
    term.includes(" ")
  ) {

    score += 4;

  }


  if (
    /^[A-Z]/.test(term)
  ) {

    score += 3;

  }


  score +=
    Math.min(
      term.length / 10,
      3
    );


  return score;

}



// ==========================================
// DISTRACTORS
// ==========================================

function chooseDistractors(
  correct,
  pool,
  count
) {

  const correctIsNumber =
    /^\d/.test(correct);


  let candidates =
    pool.filter(item => {

      const itemIsNumber =
        /^\d/.test(item);


      /*
        If answer is a number,
        prefer number distractors.
      */

      if (correctIsNumber) {

        return itemIsNumber;

      }


      /*
        Named answers should preferably
        use other named answers.
      */

      return !itemIsNumber;

    });


  /*
    If there aren't enough matching
    distractors, use the full pool.
  */

  if (
    candidates.length < count
  ) {

    candidates =
      pool.slice();

  }


  candidates =
    shuffle(
      [...new Set(candidates)]
    );


  return candidates
    .slice(0, count);

}



// ==========================================
// DISPLAY QUIZ
// ==========================================

function renderQuiz(questions) {

  questions.forEach(
    (question, index) => {

      const box =
        document.createElement("div");


      box.className =
        "question";


      const title =
        document.createElement("div");


      title.className =
        "question-title";


      title.textContent =
        `Question ${index + 1}: ${question.question}`;


      box.appendChild(
        title
      );


      const resultBox =
        document.createElement("div");


      resultBox.className =
        "result";


      question.answers.forEach(
        answer => {

          const button =
            document.createElement("button");


          button.className =
            "answer";


          button.textContent =
            answer;


          button.addEventListener(
            "click",
            () => {

              const buttons =
                box.querySelectorAll(
                  ".answer"
                );


              buttons.forEach(
                item => {

                  item.disabled = true;


                  if (
                    item.textContent ===
                    question.correct
                  ) {

                    item.classList.add(
                      "correct"
                    );

                  }

                }
              );


              if (
                answer ===
                question.correct
              ) {

                resultBox.textContent =
                  "Correct.";

              }

              else {

                button.classList.add(
                  "wrong"
                );


                resultBox.textContent =
                  `Correct answer: ${question.correct}`;

              }

            }
          );


          box.appendChild(
            button
          );

        }
      );


      box.appendChild(
        resultBox
      );


      quizContainer.appendChild(
        box
      );

    }
  );

}



// ==========================================
// KEY POINT EXTRACTION
// ==========================================

function extractKeyPoints(
  text,
  maxPoints = 6
) {

  let sentences =
    splitIntoSentences(text);


  let candidates = [];


  for (const sentence of sentences) {

    candidates.push(
      ...splitLongSentence(sentence)
    );

  }


  candidates =
    candidates
      .map(cleanCandidate)
      .filter(Boolean)
      .filter(item =>
        item.length >= 25
      );


  if (!candidates.length) {
    return [];
  }


  const stopWords =
    new Set([
      "the","a","an","and","or","but",
      "if","then","to","of","in","on",
      "for","with","at","by","from",
      "is","are","was","were","be",
      "been","being","it","its","this",
      "that","these","those","i","you",
      "he","she","we","they","them",
      "our","your","their","my","me",
      "as","so","do","does","did",
      "have","has","had","can","could",
      "should","would","about","into",
      "than","too","very","just","also",
      "some","any","more","not","no",
      "yes","yeah","oh","um","uh",
      "well","really","basically",
      "actually"
    ]);


  const frequency = {};


  for (const candidate of candidates) {

    for (
      const word of
      tokenize(candidate)
    ) {

      if (
        word.length < 3 ||
        stopWords.has(word)
      ) {
        continue;
      }


      frequency[word] =
        (frequency[word] || 0) + 1;

    }

  }


  const scored =
    candidates.map(
      (candidate, index) => {

        const words =
          tokenize(candidate);


        let score = 0;


        for (const word of words) {

          if (
            !stopWords.has(word) &&
            frequency[word]
          ) {

            score +=
              frequency[word];

          }

        }


        score /=
          Math.sqrt(
            Math.max(
              words.length,
              1
            )
          );


        if (
          /\d/.test(candidate)
        ) {

          score += 5;

        }


        const caps =
          candidate.match(
            /\b[A-Z][A-Za-z0-9.-]+\b/g
          );


        if (caps) {

          score +=
            Math.min(
              caps.length * 1.3,
              5
            );

        }


        if (
          /\b(important|key|main|new|announce|announced|launch|launched|release|released|open-source|open sourcing|model|weights|study|research|result|found|shows|means|because|therefore|cause|effect|risk|benefit|increase|decrease|future|coming|plan|planning|agent|available|first|largest|highest|latest)\b/i.test(
            candidate
          )
        ) {

          score += 5;

        }


        if (index <= 2) {
          score += 2;
        }


        if (
          /\?$/.test(candidate)
        ) {

          score -= 8;

        }


        return {
          text: candidate,
          score,
          index
        };

      }
    );


  scored.sort(
    (a, b) =>
      b.score - a.score
  );


  const selected = [];


  for (const candidate of scored) {

    const duplicate =
      selected.some(
        existing =>
          similarity(
            existing.text,
            candidate.text
          ) > 0.58
      );


    if (!duplicate) {

      selected.push(
        candidate
      );

    }


    if (
      selected.length >=
      maxPoints
    ) {
      break;
    }

  }


  selected.sort(
    (a, b) =>
      a.index - b.index
  );


  return selected
    .map(item =>
      makeConcisePoint(
        item.text
      )
    )
    .filter(Boolean);

}



// ==========================================
// SENTENCE SPLITTING
// ==========================================

function splitIntoSentences(text) {

  const normalized =
    text
      .replace(/\s+/g, " ")
      .trim();


  if (
    typeof Intl !== "undefined" &&
    Intl.Segmenter
  ) {

    try {

      const segmenter =
        new Intl.Segmenter(
          "en",
          {
            granularity:
              "sentence"
          }
        );


      const segments =
        [...segmenter.segment(
          normalized
        )]
          .map(item =>
            item.segment.trim()
          )
          .filter(item =>
            item.length > 15
          );


      if (segments.length) {

        return segments;

      }

    }

    catch (error) {

      console.warn(error);

    }

  }


  const protectedText =
    normalized.replace(
      /(\d)\.(\d)/g,
      "$1__DECIMAL_DOT__$2"
    );


  return protectedText
    .match(
      /[^.!?]+[.!?]+|[^.!?]+$/g
    )
    ?.map(sentence =>
      sentence
        .replace(
          /__DECIMAL_DOT__/g,
          "."
        )
        .trim()
    )
    .filter(sentence =>
      sentence.length > 15
    ) || [];

}



// ==========================================
// LONG SENTENCES
// ==========================================

function splitLongSentence(sentence) {

  if (
    sentence.length < 210
  ) {

    return [sentence];

  }


  const parts =
    sentence.split(
      /;\s+|,\s+(?=(?:and|but|while|because|so)\s+)/i
    );


  return parts
    .map(part =>
      part.trim()
    )
    .filter(part =>
      part.length > 25
    );

}



// ==========================================
// CLEAN TEXT
// ==========================================

function cleanCandidate(text) {

  return text
    .replace(/\s+/g, " ")
    .replace(
      /^(yeah|oh|um|uh|well|okay|ok|right|basically|actually)[,.]?\s+/i,
      ""
    )
    .replace(
      /^I(?:'m| am) (?:proud|happy|excited) to (?:share|announce) that\s+/i,
      ""
    )
    .replace(
      /\s+and I(?:'m| am) looking forward to sharing more soon\.?$/i,
      ""
    )
    .trim();

}



function makeConcisePoint(text) {

  let point =
    cleanCandidate(text);


  if (
    point.length > 220
  ) {

    point =
      point
        .slice(0, 210)
        .trim() +
      "...";

  }


  return (
    point.charAt(0).toUpperCase() +
    point.slice(1)
  );

}



// ==========================================
// HELPERS
// ==========================================

function tokenize(text) {

  return text
    .toLowerCase()
    .replace(
      /[^a-z0-9'.-]/g,
      " "
    )
    .split(/\s+/)
    .filter(Boolean);

}



function similarity(a, b) {

  const A =
    new Set(
      tokenize(a)
    );


  const B =
    new Set(
      tokenize(b)
    );


  const intersection =
    [...A]
      .filter(word =>
        B.has(word)
      )
      .length;


  const union =
    new Set([
      ...A,
      ...B
    ]).size;


  return union
    ? intersection / union
    : 0;

}



function replaceFirstInsensitive(
  text,
  search,
  replacement
) {

  const escaped =
    search.replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );


  return text.replace(
    new RegExp(
      escaped,
      "i"
    ),
    replacement
  );

}



function shuffle(array) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}



// ==========================================
// MEDIA
// ==========================================

function getMediaDuration(file) {

  return new Promise(
    (resolve, reject) => {

      const media =
        document.createElement(
          file.type.startsWith("video")
            ? "video"
            : "audio"
        );


      const url =
        URL.createObjectURL(file);


      media.preload =
        "metadata";


      media.onloadedmetadata = () => {

        const duration =
          media.duration;


        URL.revokeObjectURL(
          url
        );


        resolve(duration);

      };


      media.onerror = () => {

        URL.revokeObjectURL(
          url
        );


        reject(
          new Error(
            "Unsupported media file."
          )
        );

      };


      media.src = url;

    }
  );

}



// ==========================================
// AUDIO FOR WHISPER
// ==========================================

async function convertToWhisperAudio(file) {

  const arrayBuffer =
    await file.arrayBuffer();


  const audioContext =
    new AudioContext();


  let decodedAudio;


  try {

    decodedAudio =
      await audioContext.decodeAudioData(
        arrayBuffer.slice(0)
      );

  }

  catch (error) {

    await audioContext.close();


    throw new Error(
      "Your browser could not extract audio from this video."
    );

  }


  const TARGET_RATE =
    16000;


  const offlineContext =
    new OfflineAudioContext(
      1,
      Math.ceil(
        decodedAudio.duration *
        TARGET_RATE
      ),
      TARGET_RATE
    );


  const source =
    offlineContext.createBufferSource();


  source.buffer =
    decodedAudio;


  source.connect(
    offlineContext.destination
  );


  source.start();


  const rendered =
    await offlineContext.startRendering();


  const audio =
    new Float32Array(
      rendered.getChannelData(0)
    );


  await audioContext.close();


  return audio;

}

</script>
