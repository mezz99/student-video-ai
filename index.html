<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Video AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
      background: #f7f7f7;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    h2 {
      margin-top: 30px;
    }

    button {
      padding: 12px 20px;
      margin-top: 15px;
      cursor: pointer;
      font-size: 16px;
    }

    input {
      margin-top: 15px;
    }

    .status {
      margin-top: 18px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      margin-top: 15px;
      padding: 14px;
      box-sizing: border-box;
      font-size: 15px;
      line-height: 1.6;
    }

    #keyPointsOutput {
      min-height: 190px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Student Video AI</h1>

  <p>
    Upload a lesson video and generate a timestamped transcript and key points directly on your device.
  </p>

  <input
    type="file"
    id="fileInput"
    accept="video/*,audio/*"
  >

  <br>

  <button id="transcribeButton" disabled>
    Generate Transcript
  </button>

  <div id="status" class="status">
    Select a video.
  </div>


  <h2>Timestamped Transcript</h2>

  <textarea
    id="transcriptOutput"
    readonly
    placeholder="Your transcript will appear here..."
  ></textarea>


  <button id="keyPointsButton" disabled>
    Generate Key Points
  </button>

  <div id="keyPointsStatus" class="status"></div>


  <h2>Key Points</h2>

  <textarea
    id="keyPointsOutput"
    readonly
    placeholder="Your key points will appear here..."
  ></textarea>

</div>


<script type="module">

import {
  pipeline
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";


const fileInput =
  document.getElementById("fileInput");

const transcribeButton =
  document.getElementById("transcribeButton");

const status =
  document.getElementById("status");

const transcriptOutput =
  document.getElementById("transcriptOutput");

const keyPointsButton =
  document.getElementById("keyPointsButton");

const keyPointsStatus =
  document.getElementById("keyPointsStatus");

const keyPointsOutput =
  document.getElementById("keyPointsOutput");


const MAX_SIZE =
  100 * 1024 * 1024;

const MAX_DURATION =
  10 * 60;


let selectedFile = null;
let transcriber = null;

/*
  Keep a clean transcript separately.

  The user sees the timestamped version,
  but key-point extraction uses this clean text.
*/
let rawTranscript = "";



// ==========================================
// SELECT FILE
// ==========================================

fileInput.addEventListener("change", async () => {

  transcriptOutput.value = "";
  keyPointsOutput.value = "";

  rawTranscript = "";

  transcribeButton.disabled = true;
  keyPointsButton.disabled = true;

  selectedFile = null;


  const file =
    fileInput.files[0];


  if (!file) {

    status.textContent =
      "Select a video.";

    return;

  }


  if (file.size > MAX_SIZE) {

    status.textContent =
      "Video too large. Maximum size is 100 MB.";

    return;

  }


  status.textContent =
    "Checking video...";


  try {

    const duration =
      await getMediaDuration(file);


    if (duration > MAX_DURATION) {

      status.textContent =
        "Video too long. Maximum duration is 10 minutes.";

      return;

    }


    selectedFile = file;


    status.textContent =
      `Ready — ${Math.round(duration)} seconds`;


    transcribeButton.disabled = false;

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "Could not read this video.";

  }

});



// ==========================================
// TRANSCRIBE WITH WHISPER
// ==========================================

transcribeButton.addEventListener(
  "click",
  async () => {

    if (!selectedFile) return;


    transcribeButton.disabled = true;
    keyPointsButton.disabled = true;

    transcriptOutput.value = "";
    keyPointsOutput.value = "";

    rawTranscript = "";

    keyPointsStatus.textContent = "";


    try {

      status.textContent =
        "Extracting audio...";


      const audio =
        await convertToWhisperAudio(
          selectedFile
        );


      if (!transcriber) {

        status.textContent =
          "Loading Whisper AI...";


        transcriber = await pipeline(
          "automatic-speech-recognition",
          "onnx-community/whisper-tiny.en",
          {
            dtype: "fp32",

            progress_callback: (data) => {

              if (
                data.status === "progress" &&
                typeof data.progress === "number"
              ) {

                status.textContent =
                  `Loading Whisper: ${Math.round(data.progress)}%`;

              }

            }
          }
        );

      }


      status.textContent =
        "Transcribing video...";


      const result =
        await transcriber(
          audio,
          {
            chunk_length_s: 30,
            stride_length_s: 5,

            // NEW:
            return_timestamps: true
          }
        );


      rawTranscript =
        result.text?.trim() || "";


      if (!rawTranscript) {

        throw new Error(
          "Whisper returned an empty transcript."
        );

      }


      // Show timestamped version
      transcriptOutput.value =
        formatTimestampedTranscript(
          result
        );


      status.textContent =
        "Transcript complete.";


      keyPointsButton.disabled = false;

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "Error: " + error.message;

    }

    finally {

      transcribeButton.disabled = false;

    }

  }
);



// ==========================================
// FORMAT TIMESTAMPED TRANSCRIPT
// ==========================================

function formatTimestampedTranscript(result) {

  if (
    !result.chunks ||
    !result.chunks.length
  ) {

    return result.text || "";

  }


  return result.chunks
    .map(chunk => {

      const start =
        chunk.timestamp?.[0] ?? 0;

      const end =
        chunk.timestamp?.[1];


      const startText =
        formatTime(start);


      const endText =
        typeof end === "number"
          ? formatTime(end)
          : "--:--";


      const text =
        chunk.text?.trim() || "";


      return (
        `[${startText} - ${endText}]\n` +
        `${text}`
      );

    })
    .join("\n\n");

}



// ==========================================
// FORMAT SECONDS
// ==========================================

function formatTime(seconds) {

  const total =
    Math.max(
      0,
      Math.floor(seconds)
    );


  const minutes =
    Math.floor(total / 60);


  const secs =
    total % 60;


  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );

}



// ==========================================
// GENERATE KEY POINTS
// ==========================================

keyPointsButton.addEventListener(
  "click",
  () => {

    if (!rawTranscript) return;


    keyPointsStatus.textContent =
      "Finding important points...";


    try {

      const points =
        extractKeyPoints(
          rawTranscript,
          6
        );


      if (!points.length) {

        throw new Error(
          "Could not find useful key points."
        );

      }


      keyPointsOutput.value =
        points
          .map(point =>
            `• ${point}`
          )
          .join("\n\n");


      keyPointsStatus.textContent =
        "Key points complete.";

    }

    catch (error) {

      console.error(error);

      keyPointsStatus.textContent =
        "Error: " + error.message;

    }

  }
);



// ==========================================
// KEY POINT EXTRACTION
// ==========================================

function extractKeyPoints(
  text,
  maxPoints = 6
) {

  let sentences =
    splitIntoSentences(text);


  let candidates = [];


  for (const sentence of sentences) {

    const parts =
      splitLongSentence(sentence);

    candidates.push(...parts);

  }


  candidates =
    candidates
      .map(cleanCandidate)
      .filter(Boolean)
      .filter(candidate =>
        candidate.length >= 25
      );


  if (!candidates.length) {
    return [];
  }


  const stopWords =
    new Set([
      "the","a","an","and","or","but",
      "if","then","to","of","in","on",
      "for","with","at","by","from",
      "is","are","was","were","be",
      "been","being","it","its","this",
      "that","these","those","i","you",
      "he","she","we","they","them",
      "our","your","their","my","me",
      "as","so","do","does","did",
      "have","has","had","can","could",
      "should","would","about","into",
      "than","too","very","just","also",
      "some","any","more","not","no",
      "yes","yeah","oh","um","uh",
      "well","really","basically",
      "actually"
    ]);


  const frequency = {};


  for (const candidate of candidates) {

    for (const word of tokenize(candidate)) {

      if (
        word.length < 3 ||
        stopWords.has(word)
      ) {
        continue;
      }


      frequency[word] =
        (frequency[word] || 0) + 1;

    }

  }


  const scored =
    candidates.map(
      (candidate, index) => {

        const words =
          tokenize(candidate);


        let score = 0;


        for (const word of words) {

          if (
            !stopWords.has(word) &&
            frequency[word]
          ) {

            score += frequency[word];

          }

        }


        score =
          score /
          Math.sqrt(
            Math.max(
              words.length,
              1
            )
          );


        if (/\d/.test(candidate)) {
          score += 5;
        }


        const capitalized =
          candidate.match(
            /\b[A-Z][A-Za-z0-9.-]+\b/g
          );


        if (capitalized) {

          score +=
            Math.min(
              capitalized.length * 1.3,
              5
            );

        }


        if (
          /\b(important|key|main|new|announce|announced|launch|launched|release|released|open-source|open sourcing|model|weights|study|research|result|found|shows|means|because|therefore|cause|effect|risk|benefit|increase|decrease|future|coming|plan|planning|agent|available|first|largest|highest|latest)\b/i.test(
            candidate
          )
        ) {

          score += 5;

        }


        if (index <= 2) {
          score += 2;
        }


        if (
          /\?$/.test(candidate) ||
          /\b(do you|what do you|how do you|don't you)\b/i.test(
            candidate
          )
        ) {

          score -= 8;

        }


        if (
          /^(yeah|oh|well|um|uh|right|okay)\b/i.test(
            candidate
          )
        ) {

          score -= 7;

        }


        return {
          text: candidate,
          score,
          index
        };

      }
    );


  scored.sort(
    (a, b) =>
      b.score - a.score
  );


  const selected = [];


  for (const candidate of scored) {

    const duplicate =
      selected.some(
        existing =>
          similarity(
            existing.text,
            candidate.text
          ) > 0.58
      );


    if (!duplicate) {

      selected.push(candidate);

    }


    if (
      selected.length >= maxPoints
    ) {
      break;
    }

  }


  selected.sort(
    (a, b) =>
      a.index - b.index
  );


  return selected
    .map(item =>
      makeConcisePoint(
        item.text
      )
    )
    .filter(Boolean);

}



// ==========================================
// SENTENCE SPLITTING
// ==========================================

function splitIntoSentences(text) {

  const normalized =
    text
      .replace(/\s+/g, " ")
      .trim();


  if (
    typeof Intl !== "undefined" &&
    Intl.Segmenter
  ) {

    try {

      const segmenter =
        new Intl.Segmenter(
          "en",
          {
            granularity: "sentence"
          }
        );


      const segments =
        [...segmenter.segment(normalized)]
          .map(item =>
            item.segment.trim()
          )
          .filter(item =>
            item.length > 15
          );


      if (segments.length) {
        return segments;
      }

    }

    catch (error) {

      console.warn(
        error
      );

    }

  }


  const protectedText =
    normalized.replace(
      /(\d)\.(\d)/g,
      "$1__DECIMAL_DOT__$2"
    );


  return protectedText
    .match(
      /[^.!?]+[.!?]+|[^.!?]+$/g
    )
    ?.map(sentence =>
      sentence
        .replace(
          /__DECIMAL_DOT__/g,
          "."
        )
        .trim()
    )
    .filter(sentence =>
      sentence.length > 15
    ) || [];

}



// ==========================================
// SPLIT VERY LONG SENTENCES
// ==========================================

function splitLongSentence(sentence) {

  if (sentence.length < 210) {

    return [sentence];

  }


  const parts =
    sentence.split(
      /;\s+|,\s+(?=(?:and|but|while|because|so)\s+(?:we|they|it|this|that|you|he|she|there|the)\b)/i
    );


  if (parts.length <= 1) {

    return [sentence];

  }


  return parts
    .map(part =>
      part.trim()
    )
    .filter(part =>
      part.length > 25
    );

}



// ==========================================
// CLEAN SENTENCE
// ==========================================

function cleanCandidate(text) {

  let cleaned =
    text
      .replace(/\s+/g, " ")
      .trim();


  cleaned =
    cleaned.replace(
      /^(yeah|oh|um|uh|well|okay|ok|right|basically|actually)[,.]?\s+/i,
      ""
    );


  cleaned =
    cleaned.replace(
      /^I(?:'m| am) (?:proud|happy|excited) to (?:share|announce) that\s+/i,
      ""
    );


  cleaned =
    cleaned.replace(
      /^I wanted to (?:share|say|tell you) that\s+/i,
      ""
    );


  cleaned =
    cleaned.replace(
      /\s+and I(?:'m| am) looking forward to sharing more soon\.?$/i,
      ""
    );


  return cleaned.trim();

}



// ==========================================
// CLEAN KEY POINT
// ==========================================

function makeConcisePoint(text) {

  let point =
    cleanCandidate(text);


  point =
    point.replace(
      /^We're also\s+/i,
      "We are "
    );


  point =
    point.replace(
      /^We've got\s+/i,
      "There are "
    );


  point =
    point
      .replace(/\s+/g, " ")
      .trim();


  if (point.length > 220) {

    point =
      findGoodCut(
        point,
        200
      ) + "...";

  }


  point =
    point.charAt(0).toUpperCase() +
    point.slice(1);


  return point;

}



// ==========================================
// SHORTEN LONG KEY POINT
// ==========================================

function findGoodCut(
  text,
  targetLength
) {

  const portion =
    text.slice(
      0,
      targetLength
    );


  const comma =
    portion.lastIndexOf(",");


  const conjunction =
    Math.max(
      portion.lastIndexOf(" and "),
      portion.lastIndexOf(" but ")
    );


  const cut =
    Math.max(
      comma,
      conjunction
    );


  if (cut > 100) {

    return text
      .slice(0, cut)
      .trim();

  }


  return portion.trim();

}



// ==========================================
// TOKENIZE
// ==========================================

function tokenize(text) {

  return text
    .toLowerCase()
    .replace(
      /[^a-z0-9'.-]/g,
      " "
    )
    .split(/\s+/)
    .filter(Boolean);

}



// ==========================================
// DUPLICATE DETECTION
// ==========================================

function similarity(a, b) {

  const wordsA =
    new Set(
      tokenize(a)
    );


  const wordsB =
    new Set(
      tokenize(b)
    );


  const intersection =
    [...wordsA]
      .filter(word =>
        wordsB.has(word)
      )
      .length;


  const union =
    new Set([
      ...wordsA,
      ...wordsB
    ]).size;


  return union
    ? intersection / union
    : 0;

}



// ==========================================
// MEDIA DURATION
// ==========================================

function getMediaDuration(file) {

  return new Promise(
    (resolve, reject) => {

      const media =
        document.createElement(
          file.type.startsWith("video")
            ? "video"
            : "audio"
        );


      const url =
        URL.createObjectURL(file);


      media.preload =
        "metadata";


      media.onloadedmetadata = () => {

        const duration =
          media.duration;


        URL.revokeObjectURL(url);

        resolve(duration);

      };


      media.onerror = () => {

        URL.revokeObjectURL(url);

        reject(
          new Error(
            "Unsupported media file."
          )
        );

      };


      media.src = url;

    }
  );

}



// ==========================================
// EXTRACT AUDIO
// ==========================================

async function convertToWhisperAudio(file) {

  const arrayBuffer =
    await file.arrayBuffer();


  const audioContext =
    new AudioContext();


  let decodedAudio;


  try {

    decodedAudio =
      await audioContext.decodeAudioData(
        arrayBuffer.slice(0)
      );

  }

  catch (error) {

    await audioContext.close();

    throw new Error(
      "Your browser could not extract audio from this video."
    );

  }


  const TARGET_RATE =
    16000;


  const offlineContext =
    new OfflineAudioContext(
      1,
      Math.ceil(
        decodedAudio.duration *
        TARGET_RATE
      ),
      TARGET_RATE
    );


  const source =
    offlineContext.createBufferSource();


  source.buffer =
    decodedAudio;


  source.connect(
    offlineContext.destination
  );


  source.start();


  const rendered =
    await offlineContext.startRendering();


  const audio =
    new Float32Array(
      rendered.getChannelData(0)
    );


  await audioContext.close();


  return audio;

}

</script>

</body>
</html>
